name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: shared :: jvmTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Alvo JVM do KMP: cobre todo `commonMain` / `commonTest` e é o mais rápido.
      # Testes específicos de iOS entrarão na Fase 2, quando o projeto adicionar
      # regressão numérica cross-platform via `iosSimulatorArm64Test`.
      - name: Run commonTest on JVM
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/jvmTest/
